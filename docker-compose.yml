version: "3.9"
services:
  server-flask:
    build: "server/"
    ports:
      - "5000:5000"
    depends_on: 
      - es01

  cron-job:
    build: "cron-job/"
    depends_on: 
      - es01
  
  search-app:
    build: "app/"
    ports:
      - "3000:3000"
    depends_on: 
      - es01
      - server-flask
      - cron-job

  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.12.1
    container_name: es01
    environment:
      - node.name=es01
      - cluster.name=es-docker-cluster
      - cluster.initial_master_nodes=es01
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - data01:/usr/share/elasticsearch/data
    ports:
      - 9200:9200

volumes:
  data01:
    driver: local